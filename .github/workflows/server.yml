name: Key server

# Tests the Clearinghouse key server and, on main or by hand, deploys it to Cloudflare Workers.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy, and passes
# BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET and CH_USERS to the Worker as its own secrets. None of
# them is ever printed.

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."; exit 1
          fi
      - run: npx --yes wrangler@4 deploy
      - name: Give the Worker its secrets
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          CH_USERS: ${{ secrets.CH_USERS }}
        run: |
          for name in BLIZZARD_CLIENT_ID BLIZZARD_CLIENT_SECRET CH_USERS; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::warning::$name is not set; skipping it."; continue; fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" > /dev/null
            echo "set $name"
          done
