name: Clearinghouse app

on:
  pull_request:
    paths: ["companion/**", ".github/workflows/companion.yml"]
  push:
    branches: [main]
    paths: ["companion/**", ".github/workflows/companion.yml"]
    tags: ["companion-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Live check against Blizzard (counts only)
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python live_check.py

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --onedir --windowed --name Clearinghouse
          --icon clearinghouse.ico
          --add-data "clearinghouse_app/icon.png;."
          --add-data "clearinghouse.ico;."
          --add-data "clearinghouse_app/ui;ui"
          --hidden-import pystray._win32
          --hidden-import keyring.backends.Windows
          --collect-all webview
          run_clearinghouse.py
      - name: Smoke test the build imports
        run: python -c "import clearinghouse_app.app, clearinghouse_app.api, pystray, keyring, PIL, webview"
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
          $v = python -c "import clearinghouse_app; print(clearinghouse_app.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/companion-v')
        shell: pwsh
        run: |
          $v = python -c "import clearinghouse_app; print(clearinghouse_app.__version__)"
          if ("companion-v$v" -ne "${{ github.ref_name }}") { Write-Error "Tag ${{ github.ref_name }} but the app says $v"; exit 1 }
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/companion-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Compress-Archive -Path addon/Clearinghouse -DestinationPath dist/Clearinghouse-addon.zip -Force
          gh release create "${{ github.ref_name }}" dist/Clearinghouse-Setup.exe dist/Clearinghouse-addon.zip `
            --title "Clearinghouse ${{ github.ref_name }}" --notes "Install or update with Clearinghouse-Setup.exe. The app updates itself from here."
      - uses: actions/upload-artifact@v4
        with:
          name: Clearinghouse-app-and-addon
          path: |
            companion/dist/Clearinghouse-Setup.exe
            companion/addon/Clearinghouse
